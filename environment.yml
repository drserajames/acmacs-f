# Conda environment for acmacs-f: the external tree tools, plus a Python that can build af.
#
#   conda env create -f environment.yml      (or: mamba / micromamba create -f ...)
#   conda activate acmacs-f
#   pip install -e '.[dev]'
#
# Every tool below has native osx-arm64 and linux-64 builds on bioconda (checked with the
# anaconda.org API, 24 Sep 2026); treeswift and treetime are noarch. Lower bounds are the
# versions workstream 5 has run on macOS arm64. Tighten to exact pins per production round
# with `conda env export`, not here.
name: acmacs-f
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python >=3.11
  - pip
  # Building af (scikit-build-core fetches these itself under pip; listed so the
  # C++ optimiser also builds offline from this env).
  - cmake >=3.26
  - ninja
  - cxx-compiler
  - scikit-build-core >=0.10
  - pybind11 >=2.12
  # Tree inference and processing (workstream 5).
  - cmaple >=2.0          # production on the server still runs 1.0.0; workstream 5 compares them
  - iqtree >=3.1.3        # binary: iqtree3
  - raxml-ng >=2.0.3      # reference ASR, for comparison only
  - usher >=0.6.6         # provides matUtils
  - nextclade >=3.23
  - gotree >=0.5.2
  - treetime >=0.12.1     # noarch; the linux-64-only builds stop at 0.2.4, don't pin below
  - treeswift >=1.1.50
  # Python libraries the tree steps use.
  - biopython >=1.88
  - numpy >=2
