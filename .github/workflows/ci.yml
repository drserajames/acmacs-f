# CI for acmacs-f: build, lint, type-check, test, and the WHO-data gate.
#
# Runs on Linux x86_64 and macOS arm64. Tests that need the private data repo
# (the af_data fixture) skip here, as do tests needing a real SLURM cluster.
name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.11" }   # Linux x86_64, oldest supported Python
          - { os: ubuntu-latest, python: "3.13" }
          - { os: macos-14, python: "3.13" }        # macOS arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Builds the C++ optimiser too once cpp/optimiser/ exists (alglib is fetched
      # and hash-checked by cpp/CMakeLists.txt); until then this is pure Python.
      - name: Install
        run: python -m pip install -v -e '.[dev,geo]'   # every extra, so no test skips for want of one
      - name: Ruff
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Mypy
        run: python -m mypy
      # A test that skips because an import is missing (pytest.importorskip) would leave
      # CI green without running it: fail on those. Skips for the private data repo or a
      # SLURM cluster are expected here and allowed.
      - name: Pytest
        run: |
          set -o pipefail   # GitHub's default bash has no pipefail: tee would hide a pytest failure
          python -m pytest -rs | tee pytest.log
          if grep -E "^SKIPPED .*could not import" pytest.log; then
            echo "::error::tests skipped for a missing import; add the dependency to pyproject.toml"
            exit 1
          fi

  who-data-gate:
    # The logs of a public repo are public: --redact reports findings by location and
    # rule only, never the matched value. No --strict: that needs the private strain
    # list, which CI does not have (and --strict fails on its absence by design), so the
    # name-list check is skipped here and the structural rules still run. The hooks on
    # developers' machines run --strict. Adapted from ae's who-data-gate.yml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # --range needs the history
      - name: Scan tracked file contents at the tip
        run: python3 tools/who-data-gate.py --all --quiet --redact
      # The tip scan cannot see data one commit added and a later one removed; it still
      # ships in the history. --range scans each commit's blobs and message.
      - name: Scan every commit in this push / PR (files and messages)
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -eu
          if [ "$EVENT" = "pull_request" ]; then
            git fetch --quiet origin "$BASE_REF"
            RANGE="origin/$BASE_REF..$PR_HEAD"
          elif [ -n "$BEFORE" ] \
               && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            RANGE="$BEFORE..$AFTER"
          else
            # New branch, force-push whose old tip is gone, or first push: what is not
            # already on the default branch.
            git fetch --quiet origin "$DEFAULT_BRANCH"
            RANGE="origin/$DEFAULT_BRANCH..$AFTER"
          fi
          echo "Scanning every commit in: $RANGE"
          python3 tools/who-data-gate.py --range "$RANGE" --redact

  tools:
    # The tests of external tools (CMAPLE, IQ-TREE, RAxML-NG, TreeTime, Nextclade, pdflatex:
    # every test marked @pytest.mark.tool), run in the conda environment users install from
    # environment.yml, plus LaTeX for the report tests. --require-tools turns "tool not
    # installed" from a skip into a failure: a green run means each tool test really ran
    # (Sarah, Q26). Installing the environment also proves it solves on both platforms.
    name: tool tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    defaults:
      run:
        shell: bash -el {0}   # login shell, so the micromamba environment is active
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          cache-environment: true
      # LaTeX for the report tests: Ubuntu's TeX Live on Linux. conda-forge's texlive-core
      # is unusable (no pdflatex.fmt; and it cannot be solved with environment.yml), and a
      # full TeX on the macOS runner is slow, so macOS skips pdflatex explicitly (below).
      - name: LaTeX (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends texlive-latex-extra
      # Apple clang on macOS: conda-forge's clang cannot link with recent Xcode linkers
      # (`-lto_library` rejected); Apple clang gives bit-identical optimiser results.
      - name: Install af into the environment
        run: |
          if [ "$RUNNER_OS" = macOS ]; then export CC=/usr/bin/clang CXX=/usr/bin/clang++; fi
          python -m pip install -v -e '.[dev,geo]'
      - name: Tool tests (fail if a tool is missing)
        run: |
          set -o pipefail
          skip=""
          if [ "$RUNNER_OS" = macOS ]; then skip="--skip-tool pdflatex"; fi
          python -m pytest -m tool --require-tools $skip -rs | tee tools.log
