# Every influenza subtype af handles, and the facts about it that more than one part of af
# needs. This is the one editable copy (design rule 6): code looks these up through
# af.util.subtypes and never spells them out. A subtype or value absent here is an error
# everywhere, never a silent default.
#
# [table_subtype."<name>"]: the titre tables' subtype field, and facts that belong to it
#   rather than to one lineage.
# [subtype.<key>]: one row per subtype; the key is its store dataset key (sequences/h3,
#   clades/h3, ...). Sub-tables of a row (e.g. [subtype.h3.clades]) belong to the workstream
#   that names them, and are validated there, not by the loader.
# Rows are kept in this order wherever several match (B/Vic before B/Yam).

[table_subtype."A(H1N1)"]
geo = "h1"                      # geographic map files: geo/<geo>-YYYY-MM.pdf

[table_subtype."A(H3N2)"]
geo = "h3"

[table_subtype."B"]
geo = "b"                       # one geographic map for both lineages
unresolved_group_prefix = "b"   # chart group prefix for a table that leaves the lineage unknown

[subtype.h1]
name = "A(H1N1)"                # af's name: sequences, clades, trees
table_subtype = "A(H1N1)"
lineage = ""                    # the titre tables' lineage field; B only
group_prefix = "h1pdm"          # chart group prefix: h1pdm-hi-turkey-<lab>
acmacs_data = "A(H1N1)"         # key in acmacs-data's clade definitions and curated vaccine list

[subtype.h1.clades]
labels = true
repository = "seasonal_A-H1N1pdm_HA"   # upstream nomenclature clone (influenza-clade-nomenclature)
ha1_length = 327
nuc_offset = 71
mature_nt = 1647   # mature-HA length in af's nucleotide strings (no stop codon), as af.seq's pin
source = "HA1 length (= offset added to an upstream HA2 position) and nucleotide offset (subtracted from an upstream nuc position) for af's mature-HA sequences, as the WHO CC trees and seqdb use them; derived empirically and re-checked Sep 2026 against the WHO CC trees and Nextclade's placements (notes/clades/ENGINE-COMPARISON.md); mature_nt: the mature HA without its stop codon, the length af.seq checks each Nextclade dataset against (expected_mature_nt), so a locus past it (B/Vic A's nuc 1843, in the 3' untranslated region) is unexpressible"

[subtype.h3]
name = "A(H3N2)"
table_subtype = "A(H3N2)"
lineage = ""
group_prefix = "h3"
acmacs_data = "A(H3N2)"

[subtype.h3.clades]
labels = true
repository = "seasonal_A-H3N2_HA"   # upstream nomenclature clone (influenza-clade-nomenclature)
ha1_length = 329
nuc_offset = 65
mature_nt = 1650   # mature-HA length in af's nucleotide strings (no stop codon), as af.seq's pin
source = "HA1 length (= offset added to an upstream HA2 position) and nucleotide offset (subtracted from an upstream nuc position) for af's mature-HA sequences, as the WHO CC trees and seqdb use them; derived empirically and re-checked Sep 2026 against the WHO CC trees and Nextclade's placements (notes/clades/ENGINE-COMPARISON.md); mature_nt: the mature HA without its stop codon, the length af.seq checks each Nextclade dataset against (expected_mature_nt), so a locus past it (B/Vic A's nuc 1843, in the 3' untranslated region) is unexpressible"

[subtype.bvic]
name = "B/Vic"
table_subtype = "B"
lineage = "VICTORIA"
group_prefix = "bvic"
acmacs_data = "BV"

[subtype.bvic.clades]
labels = true
repository = "seasonal_B-Vic_HA"   # upstream nomenclature clone (influenza-clade-nomenclature)
ha1_length = 347
nuc_offset = 78
mature_nt = 1710   # mature-HA length in af's nucleotide strings (no stop codon), as af.seq's pin
source = "HA1 length (= offset added to an upstream HA2 position) and nucleotide offset (subtracted from an upstream nuc position) for af's mature-HA sequences, as the WHO CC trees and seqdb use them; derived empirically and re-checked Sep 2026 against the WHO CC trees and Nextclade's placements (notes/clades/ENGINE-COMPARISON.md); B/Vic is 347, not the 346 in earlier notes: of 1,242 sequences Nextclade places in B/Vic A.1, 1,157 carry that clade's defining HA2 151K at mature position 347+151 and none at 346+151; mature_nt: the mature HA without its stop codon, the length af.seq checks each Nextclade dataset against (expected_mature_nt), so a locus past it (B/Vic A's nuc 1843, in the 3' untranslated region) is unexpressible"

[subtype.byam]
name = "B/Yam"
table_subtype = "B"
lineage = "YAMAGATA"
group_prefix = "byam"
acmacs_data = "BY"

[subtype.byam.clades]
labels = false
source = "Sarah, 25 Sep 2026: B/Yamagata trees and maps carry no clade labels for now, so there is no clades/byam dataset and asking for one fails"
