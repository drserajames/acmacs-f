[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "acmacs-f"
dynamic = ["version"]
description = "Phylogenetic trees and antigenic maps for influenza vaccine strain selection"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Sarah James" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
# Core runtime set, declared once for every workstream (ask workstream 1 to add to it).
# Heavy, single-area libraries go in an extra instead, and CI installs every extra.
dependencies = [
  "numpy>=2",         # chart/optimiser arrays (I1), maps, tree figure
  "pyarrow>=16",      # Parquet: sequence and serology stores
  "duckdb>=1.1",      # queries over the Parquet stores (serology, stat)
  "matplotlib>=3.8",  # every report path renders PDFs
  "openpyxl>=3.1",    # lab xlsx tables (tables workstream)
  "xlrd>=2.0.1",      # GISAID metadata .xls (legacy BIFF): the only source of exact collection dates
  "brotli>=1.1",      # brotli-compressed .ace charts and tables (chains, tables)
]

[project.optional-dependencies]
geo = ["cartopy>=0.23"]  # geographic maps only; pulls in GEOS/PROJ wheels
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[project.urls]
Repository = "https://github.com/drserajames/acmacs-f"

[tool.scikit-build]
minimum-version = "build-system.requires"
wheel.packages = ["af"]
# Build in a per-interpreter directory so editable installs rebuild the C++ core
# incrementally once it exists.
build-dir = "build/{wheel_tag}"

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "af/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
# importlib mode: test files in different directories may share a basename
# without every tests/ directory needing an __init__.py.
addopts = ["--import-mode=importlib", "-ra"]
# tests/ on sys.path so tests can import shared helpers from conftest.
pythonpath = ["tests"]
markers = [
  "slurm: needs a real SLURM cluster (sbatch/srun on PATH); skipped otherwise",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# Copied verbatim from ae (MIT); kept byte-identical so updates from ae diff cleanly.
extend-exclude = ["tools/who-data-gate.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PTH"]

[tool.mypy]
# Lenient to start; tighten per package as code settles. No python_version: mypy checks
# against the interpreter running it. Pinning 3.11 broke on numpy >= 2.5's stubs, which
# use 3.12 syntax; the Python 3.11 CI job still catches 3.12-only code in af itself.
files = ["af", "tests"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
